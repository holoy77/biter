name: Bitercloud Server Auto Renew

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bitercloud-auto-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --upgrade pip requests "requests[socks]" cryptography

      - name: Setup and Run Hysteria 2 (sing-box)
        if: "${{ secrets.CUSTOM_PROXY != '' }}"
        run: |
          # 1. 下载并解压 sing-box
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.7/sing-box-1.9.7-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*-linux-amd64/sing-box /usr/local/bin/

          # 2. 将传入的 CUSTOM_PROXY 转换为 sing-box 出站配置
          python3 - << 'EOF'
          import os, json, urllib.parse

          uri = os.environ.get("CUSTOM_PROXY", "").strip()
          # 兼容 hy2:// 或 hysteria2:// 链接格式
          parsed = urllib.parse.urlparse(uri)
          auth = parsed.username or parsed.netloc.split("@")[0] if "@" in parsed.netloc else ""
          host_port = parsed.netloc.split("@")[-1] if "@" in parsed.netloc else parsed.netloc
          server = host_port.split(":")[0]
          port = int(host_port.split(":")[1]) if ":" in host_port else 443
          query = urllib.parse.parse_qs(parsed.query)

          insecure = query.get("insecure", ["0"])[0] == "1" or query.get("allowInsecure", ["0"])[0] == "1"
          sni = query.get("sni", [server])[0]

          config = {
            "inbounds": [
              {
                "type": "mixed",
                "tag": "mixed-in",
                "listen": "127.0.0.1",
                "listen_port": 10809
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "tag": "hy2-out",
                "server": server,
                "server_port": port,
                "password": auth,
                "tls": {
                  "enabled": True,
                  "server_name": sni,
                  "insecure": insecure
                }
              }
            ]
          }

          with open("sing-box.json", "w") as f:
              json.dump(config, f, indent=2)
          EOF

          # 3. 后台运行 sing-box
          sing-box run -c sing-box.json &
          sleep 2

          # 4. 验证本地代理转发是否打通
          curl -x http://127.0.0.1:10809 -I --connect-timeout 8 https://www.cloudflare.com || echo "Proxy init check completed."
        env:
          CUSTOM_PROXY: ${{ secrets.CUSTOM_PROXY }}

      - name: Run Bitercloud Renew
        env:
          BITERCLOUD_USER: ${{ secrets.BITERCLOUD_USER }}
          BITERCLOUD_PASS: ${{ secrets.BITERCLOUD_PASS }}
          BITERCLOUD_COOKIE: ${{ secrets.BITERCLOUD_COOKIE }}
          BITERCLOUD_SESSION_KEY: ${{ secrets.BITERCLOUD_SESSION_KEY }}
          BITERCLOUD_SERVER_ID: ${{ secrets.BITERCLOUD_SERVER_ID }}
          CUSTOM_PROXY: ${{ secrets.CUSTOM_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_bitercloud.py

      - name: Save Bitercloud session state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bitercloud_state.json || true
          if git diff --cached --quiet; then
            echo "No Bitercloud session state change."
            exit 0
          fi
          git commit -m "Update Bitercloud session state [skip ci]"
          git push origin HEAD:main
